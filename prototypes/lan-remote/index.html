</style><header class="top"><div><h1>Mira · 局域网对话</h1><p>交互评审原型 · 所有设备、任务与连接均为模拟数据</p></div><div class="tools"><a id="prd" href="../../docs/MIRA_LAN_REMOTE_PRD.md" target="_blank">阅读 PRD</a><button onclick="reset()">重置演示</button><button id="size" onclick="tablet=!tablet;render()">切换平板</button></div></header><main class="layout"><section class="desktop" id="desktop"></section><section><div class="device-top"><span class="muted small" id="preview-label">手机浏览器</span><span class="small muted">无需安装 App</span></div><div class="preview" id="preview"></div><div class="note">建议操作：电脑开启连接 → 模拟手机扫码 → 电脑允许 → 打开任务 → 发送消息／处理审批。下方按钮可体验异常状态。</div><div class="legend">评审场景（产品内不会出现这些按钮）<div class="tools"><button onclick="scenario('offline')">模拟断网</button><button onclick="scenario('online')">恢复网络</button><button onclick="scenario('expired')">链接过期</button><button onclick="scenario('approval')">产生审批</button><button onclick="scenario('empty')">空任务列表</button><button onclick="scenario('revoked')">撤销设备</button></div></div></section></main><div id="toast" class="toast" hidden role="status"></div><script>
let service=false,phase='idle',tablet=false,page='home',online=true,selected='t1',query='',draft='',empty=false,timer=null,link=1,projects=new Set(['core-platform','ai_test']);
let tasks;function defaults(){return[{id:'t1',project:'core-platform',title:'整理移动端连接方案',time:'刚刚',messages:[{who:'user',text:'整理一下移动端局域网连接的实现范围。'},{who:'assistant',text:'已整理连接流程、会话同步和移动端权限范围。\n任务继续在电脑上执行，手机用于查看对话、提交任务和处理审批。',file:'移动端连接方案.md'}]},{id:'t2',project:'core-platform',title:'检查会话列表的排序',time:'今天',messages:[{who:'user',text:'检查任务列表的置顶和排序。'},{who:'assistant',text:'置顶任务在前，其余按最近更新时间排列。'}]},{id:'t3',project:'ai_test',title:'整理本周研究笔记',time:'昨天',messages:[{who:'assistant',text:'研究笔记已整理完成。'}]}]};tasks=defaults();tasks.push({id:'outside',project:null,title:'空间外任务（不应显示）',messages:[]});tasks[0].approval=true;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>tasks.find(t=>t.id===selected);const available=()=>empty?[]:tasks.filter(t=>projects.has(t.project));function toast(s){let e=document.getElementById('toast');e.textContent=s;e.hidden=false;setTimeout(()=>e.hidden=true,2600)}function reset(){tasks.forEach(t=>clearTimeout(t.timer));service=false;phase='idle';page='home';online=true;empty=false;query='';draft='';projects=new Set(['core-platform','ai_test']);tasks=defaults();tasks.push({id:'outside',project:null,title:'空间外任务（不应显示）',messages:[]});tasks[0].approval=true;selected='t1';render()}
function toggle(){service=!service;phase=service?'scan':'idle';online=true;render()}function pair(){if(!service)return toast('先在电脑开启连接');phase='pending';render()}function allow(){phase='connected';page='home';online=true;selected=available()[0]?.id;draft=current()?.draft||'';render()}function revoke(){phase='revoked';render()}function newLink(){link++;phase='scan';render();toast('旧配对链接已失效')}function chooseProject(name,on){on?projects.add(name):projects.delete(name);render()}function pick(id){if(current())current().draft=draft;selected=id;page='chat';draft=current().draft||'';render()}function newTask(){let p=current()?.project||[...projects][0];if(!p)return;let id='t'+Date.now();if(current())current().draft=draft;draft='';tasks.unshift({id,project:p,title:'新对话',time:'刚刚',messages:[]});empty=false;selected=id;page='chat';current().approval=false;render()}
function list(){let filtered=available().filter(t=>t.title.includes(query));return `<div class="tasks"><button class="primary" style="width:100%" onclick="newTask()" ${online?'':'disabled'}>＋ 新建对话</button><input class="search" placeholder="搜索任务标题" aria-label="搜索任务标题" value="${esc(query)}" oninput="query=this.value;refreshTasks()"><div id="task-items">${taskItems(filtered)}</div></div><div class="task-bottom"><span>仅项目空间</span><button onclick="revoke()">断开</button></div>`}function taskItems(filtered){return filtered.length?[...projects].map(p=>{let ts=filtered.filter(t=>t.project===p);return ts.length?`<div class="group">${esc(p)}</div>${ts.map(t=>`<button class="task ${selected===t.id?'active':''}" onclick="pick('${t.id}')"><span class="dot"></span><span><strong>${esc(t.title)}</strong><small>${t.running?'正在运行':t.time}</small></span></button>`).join('')}`:''}).join(''):`<div class="empty">${query?'没有匹配的任务':'还没有任务'}<br><small>${query?'试试其他关键词':'新建对话开始工作'}</small></div>`}function refreshTasks(){document.getElementById('task-items').innerHTML=taskItems(available().filter(t=>t.title.includes(query)))}
function chat(){let t=current();if(!t||empty||!projects.has(t.project))return '<div class="center"><h2>选择一个任务</h2><p>从左侧打开对话，或新建任务。</p></div>';return `<div class="chat"><div class="phone-head">${tablet?'':`<button class="back" aria-label="返回任务列表" onclick="page='home';render()">‹</button>`}<div style="min-width:0"><h2>${esc(t.title)}</h2><p>${esc(t.project)} · ${!online?'连接中断':t.running?'正在工作':'与电脑同步'}</p></div></div>${!online?`<div class="banner">连接中断，电脑上的任务会继续<button onclick="scenario('online')">重连</button></div>`:''}<div class="messages">${t.messages.map(m=>`<div class="message ${m.who}"><div class="who">${m.who==='user'?'你':'Mira'}</div><p>${esc(m.text)}</p>${m.file?`<button type="button" class="result" style="width:100%;text-align:left" onclick="computerOnly()">文档 · ${esc(m.file)}<br><span class="small muted">打开文件 ↗</span></button><div class="tools" style="margin-top:8px"><button type="button" onclick="computerOnly()">查看变更</button><button type="button" onclick="computerOnly()">执行详情</button></div>`:''}</div>`).join('')}${t.approval?`<div class="approve"><h3>需要确认文件修改</h3><p>在项目中写入 docs/mobile-plan.md。此操作将修改电脑上的文件。</p><div class="tools"><button class="primary" ${online?'':'disabled'} onclick="respond(true)">允许本次</button><button ${online?'':'disabled'} onclick="respond(false)">拒绝</button></div></div>`:''}${t.running?`<p class="small muted" role="status">Mira 正在处理任务…</p>`:''}</div><form class="compose" onsubmit="event.preventDefault();send()">${t.queue?.length?`<div class="queue">待发送 ${t.queue.length} 条：${esc(t.queue[0])} <button type="button" ${online?'':'disabled'} onclick="if(online){current().queue.shift();render()}">撤回</button>${!t.running?`<button type="button" ${online?'':'disabled'} onclick="if(online)submit(current(),current().queue.shift())">继续发送</button>`:''}</div>`:''}${(t.attachments||[]).map((f,i)=>`<div class="queue">${esc(f.name)} · ${(f.size/1024).toFixed(0)} KB <button type="button" onclick="current().attachments.splice(${i},1);render()">移除</button></div>`).join('')}<textarea aria-label="消息" placeholder="补充要求或提出新任务" oninput="draft=this.value;current().draft=draft">${esc(draft)}</textarea><div class="tools" style="margin:8px 0"><button type="button" ${online?'':'disabled'} aria-label="添加附件" onclick="current().addOpen=!current().addOpen;render()">＋</button><select aria-label="任务权限" onchange="current().permission=this.value;toast('当前任务权限已切换（模拟）')" ${online?'':'disabled'}>${['变更前确认','自动审批','完全访问'].map(v=>`<option ${t.permission===v?'selected':''}>${v}</option>`).join('')}</select><select aria-label="思考强度" onchange="current().thinking=this.value" ${online?'':'disabled'}>${['默认','低','中','高'].map(v=>`<option ${t.thinking===v?'selected':''}>${v}</option>`).join('')}</select></div>${t.addOpen?`<div class="hint"><div class="tools"><button type="button" onclick="document.getElementById('file-input').click()">引用手机文件</button><button type="button" onclick="document.getElementById('photo-input').click()">上传照片</button></div><p class="small muted">只使用你主动选择的文件。原型不读取或上传内容。</p><button type="button" onclick="addExample()">使用示例照片（演示）</button></div>`:''}<input id="file-input" type="file" multiple hidden onchange="attachFiles(this.files)"><input id="photo-input" type="file" accept="image/*" multiple hidden onchange="attachFiles(this.files)"><div class="row"><select aria-label="选择模型" onchange="current().model=this.value" ${online?'':'disabled'}><option ${!t.model||t.model==='电脑默认模型'?'selected':''}>电脑默认模型</option><option ${t.model==='DeepSeek（已启用）'?'selected':''}>DeepSeek（已启用）</option></select><div class="tools">${t.running?`<button type="button" onclick="stop()" ${online?'':'disabled'}>停止</button>`:''}<button class="primary" ${online?'':'disabled'}>${t.running?'加入队列':'发送'}</button></div></div></form></div>`}
function computerOnly(){toast('此功能需要在电脑上使用')}function attachFiles(files){if(!online)return;let t=current();t.attachments??=[];for(let f of files)t.attachments.push({name:f.name,size:f.size});t.addOpen=false;render();toast('已选择附件；原型不读取或上传内容')}function addExample(){attachFiles([{name:'现场照片.jpg',size:248000}])}function send(){if(!online||phase!=='connected')return;if(!draft.trim()&&!current().attachments?.length)return toast('请输入消息或选择附件');let text=draft.trim();if(current().attachments?.length){text+=(text?'\n':'')+current().attachments.map(f=>'[附件] '+f.name).join('\n');current().attachments=[];}draft='';let t=current();t.draft='';if(t.running){(t.queue??=[]).push(text);render();return}submit(t,text)}
function submit(t,text){if(!t.messages.length)t.title=text.slice(0,20);t.messages.push({who:'user',text});t.running=true;render();t.timer=setTimeout(()=>{t.messages.push({who:'assistant',text:'收到，已记录这条要求。这里是模拟回复，真实任务会在电脑上的 Mira 执行。'});t.running=false;render();if(t.queue?.length)submit(t,t.queue.shift())},2400)}
function stop(){let t=current();clearTimeout(t.timer);t.running=false;t.messages.push({who:'assistant',text:'本次任务已停止。待发送消息已暂停，可手动继续。'});render()}
function respond(ok){if(!online)return;let t=current();t.approval=false;t.messages.push({who:'assistant',text:ok?'已允许本次文件修改。':'已拒绝本次文件修改，文件未变更。'});render();toast(ok?'审批已确认':'已拒绝')}
function scenario(s){if(s==='expired'){if(phase==='connected')return toast('已配对设备不受配对链接过期影响；重置后可体验');service=true;phase='expired'}if(s==='revoked'){if(phase!=='connected')return toast('请先完成配对');phase='revoked'}if(['offline','online','approval','empty'].includes(s)){if(phase!=='connected')return toast('请先完成配对');if(s==='offline')online=false;if(s==='online'){online=true;toast('已重新同步当前会话、队列和待审批事项')}if(s==='approval'){current().approval=true;page='chat'}if(s==='empty'){empty=!empty;page='home'}}render()}
function desktop(){return `<div class="row"><h2>移动端连接</h2><span class="status ${service?'':'off'}">${service?'已开启':'未开启'}</span></div><p class="muted small">用同一局域网内的手机或平板继续对话。</p><div class="block"><div class="row"><span>局域网访问</span><button class="${service?'':'primary'}" onclick="toggle()" ${!projects.size?'disabled':''}>${service?'停止服务':'开启连接'}</button></div><p class="muted small">仅在可信网络使用。电脑需保持运行；本版不经过公网中继。</p></div><div class="block"><strong>访问范围：项目空间</strong><p class="muted small">显示电脑上的项目空间及其中的任务。项目空间外的独立任务不显示，也不可访问。</p></div>${service?`<div class="block"><div class="row"><strong>配对链接</strong><span class="small muted">${phase==='expired'?'已过期':'有效期 5 分钟'}</span></div><div class="qr"><b>▣</b><span>二维码示意</span><small>不可扫码 · 请用下方模拟按钮</small></div><code class="address">http://192.168.1.23:4318/#pair=demo-${link}</code><div class="tools" style="margin-top:10px"><button onclick="toast('原型不会复制可用凭据；此地址仅为示例')">复制链接</button><button onclick="newLink()">重新生成</button></div>${phase==='pending'?`<div class="request"><strong>iPhone · Safari 请求连接</strong><span class="small">来源 192.168.1.42 · 核对码 4821</span><p class="small">可访问项目空间内的任务</p><div class="tools"><button class="primary" onclick="allow()">允许连接</button><button onclick="phase='denied';render()">拒绝</button></div></div>`:''}${phase==='connected'?`<div class="request"><strong>iPhone · Safari</strong><span class="small">${online?'在线':'暂时离线'} · 192.168.1.42</span><p class="small">可对话与处理任务，无设置和终端权限。</p><button class="danger" onclick="revoke()">断开并撤销</button></div>`:''}</div>`:''}<div class="hint"><p>手机只开放对话相关操作。Agent 仍按电脑已有权限工作；手机无法打开终端、设置或资源面板。</p></div>`}
function render(){document.getElementById('desktop').innerHTML=desktop();document.getElementById('size').textContent=tablet?'切换手机':'切换平板';document.getElementById('preview-label').textContent=tablet?'平板浏览器 · 受限双栏':'手机浏览器';let preview=document.getElementById('preview');preview.classList.toggle('tablet',tablet);let content='';if(phase==='connected'){content=tablet?`<div class="phone-head"><div><h2>Mira · 工作电脑</h2><p>${online?'已连接 · 局域网':'连接中断'}</p></div></div><div class="tablet-body"><aside class="tablet-list">${list()}</aside>${chat()}</div>`:page==='home'?`<div class="phone-head"><div><h2>Mira · 工作电脑</h2><p>${online?'已连接 · 局域网':'连接中断'}</p></div></div>${!online?'<div class="banner">网络中断，恢复后将重新同步</div>':''}${list()}`:chat()}else{let titles={idle:'连接你的电脑',scan:'准备连接 Mira',pending:'等待电脑确认',denied:'电脑拒绝了连接',expired:'配对链接已过期',revoked:'连接已断开'};let copy={idle:'在电脑上的 Mira 开启“移动端连接”，然后扫描二维码。',scan:'手机和电脑需要连接同一个局域网。',pending:'请在电脑核对下面的验证码，并允许此设备连接。',denied:'如需继续，请重新扫码并在电脑允许连接。',expired:'请在电脑重新生成链接，再次扫码。',revoked:'此设备的访问权限已撤销。电脑上的任务不受影响。'};content=`<div class="center"><div class="mark">M</div><h2>${titles[phase]}</h2><p>${copy[phase]}</p>${phase==='pending'?'<div class="code">4821</div><span class="muted small">确认前无法查看电脑上的任务</span>':`<button class="primary" onclick="${phase==='expired'?'newLink()':'pair()'}">${phase==='expired'?'模拟获取新链接':'模拟手机扫码'}</button>`}<p class="small muted">原型演示 · 不建立真实连接</p></div>`}preview.innerHTML=`<div class="browser">${service?'192.168.1.23:4318':'Mira 局域网连接'}</div><div class="screen">${content}</div>`;let msgs=preview.querySelector('.messages');if(msgs)msgs.scrollTop=msgs.scrollHeight}render();
</script></html>
