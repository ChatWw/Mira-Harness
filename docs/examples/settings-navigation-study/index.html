let mode='four',active=5;
function renderMenu(){document.querySelector('.menu').innerHTML=modes[mode].map(([label,ids])=>`<section class="group"><h2>${label}</h2>${ids.map(id=>`<button class="item ${mode==='four'&&[8,12].includes(id)?'cluster-start':''}" data-id="${id}" ${active===id?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[items[id][1]]}"/></svg><span>${items[id][0]}</span>${id===16?'<span class="scope">规划中</span>':''}</button>`).join('')}</section>`).join('');document.querySelectorAll('.item').forEach(b=>b.onclick=()=>{active=Number(b.dataset.id);renderMenu();renderPage()})}
