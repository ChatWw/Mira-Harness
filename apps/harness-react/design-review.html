<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mira Harness 工作台结构审阅</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; color: #202729; background: #e8ecee; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #168497; outline-offset: 2px; }
    .review { display: flex; min-width: 850px; height: 100vh; min-height: 620px; flex-direction: column; }
    .review-bar { display: flex; height: 54px; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 20px; padding: 0 24px; border-bottom: 1px solid #cbd3d6; background: #f2f4f5; }
    .review-bar strong { font-size: 13px; }
    .review-bar span { color: #617075; font-size: 12px; }
    .scenes { display: flex; align-items: center; gap: 4px; }
    .scenes button { min-height: 30px; padding: 0 11px; border: 1px solid transparent; border-radius: 5px; color: #566368; background: transparent; font-size: 12px; }
    .scenes button[aria-current="true"] { border-color: #adbcc1; color: #183137; background: white; font-weight: 650; }
    .shell { display: flex; min-height: 0; flex: 1; flex-direction: column; background: #f3f5f6; }
    .shell-bar { display: flex; height: 52px; flex: 0 0 auto; align-items: center; justify-content: space-between; padding: 0 26px; }
    .shell-brand, .shell-actions { display: flex; align-items: center; gap: 14px; }
    .window-controls { display: flex; align-items: center; gap: 7px; margin-right: 8px; }
    .window-controls span { width: 10px; height: 10px; border: 1px solid #0002; border-radius: 50%; }
    .window-controls span:nth-child(1) { background: #ff6a65; }
    .window-controls span:nth-child(2) { background: #ffbf45; }
    .window-controls span:nth-child(3) { background: #65cb58; }
    .shell-mark { display: grid; width: 24px; height: 24px; place-items: center; border-radius: 5px; color: white; background: #287887; font-size: 13px; font-weight: 750; }
    .shell-brand strong { font-size: 14px; }
    .shell-brand > span:last-child { padding-left: 15px; border-left: 1px solid #cbd3d6; color: #5c686d; font-size: 12px; }
    .shell-actions button { padding: 5px 7px; border: 0; color: #5c686d; background: transparent; font-size: 12px; }
    .canvas { display: flex; min-height: 0; flex: 1; overflow: hidden; margin: 0 14px 14px; border: 1px solid #d3dadd; border-radius: 7px; background: white; }
    .thread { position: relative; display: flex; min-width: 0; flex: 1; flex-direction: column; }
    .thread-head { display: flex; min-height: 78px; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 18px; padding: 12px 24px; border-bottom: 1px solid #dfe5e7; }
    .thread-title { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .thread-title > div { min-width: 0; }
    .thread-title strong { display: block; overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .thread-title small { display: block; overflow: hidden; max-width: 54vw; margin-top: 4px; color: #728086; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .thread-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 8px; }
    .icon-button { display: grid; width: 32px; height: 32px; flex: 0 0 auto; place-items: center; border: 1px solid #d8e0e3; border-radius: 5px; color: #55656a; background: white; font-size: 16px; line-height: 1; }
    .icon-button:hover, .icon-button[aria-pressed="true"] { border-color: #83b8c1; color: #0b7182; background: #f1f8f9; }
    .status { padding: 5px 9px; border-radius: 4px; color: #536268; background: #eef2f3; font-size: 11px; white-space: nowrap; }
    .status.running { color: #99630e; background: #fff4dc; }
    .status.approval { color: #9b650e; background: #fff4dc; }
    .status.complete { color: #24765d; background: #eaf6f0; }
    .status.failure { color: #aa4945; background: #fff0ef; }
    .thread-scroll { position: relative; min-height: 0; flex: 1; overflow: auto; padding: 28px max(26px, calc((100% - 760px) / 2)); }
    .summary { position: sticky; z-index: 1; top: 0; display: flex; width: max-content; max-width: 100%; align-items: center; gap: 10px; margin: -6px 0 28px auto; padding: 9px 12px; border: 1px solid #d5dfe2; border-radius: 6px; background: white; box-shadow: 0 8px 20px #172a3012; font-size: 11px; }
    .summary b { font-weight: 650; }
    .summary button { border: 0; color: #0b7182; background: transparent; font-size: 11px; }
    .thread-scroll .empty { display: grid; min-height: 100%; align-content: center; justify-items: center; padding-bottom: 70px; text-align: center; }
    .thread-scroll .empty h1 { margin: 0 0 8px; font-size: 20px; }
    .thread-scroll .empty p { margin: 0; color: #728086; font-size: 13px; }
    .message { margin-bottom: 20px; }
    .message.user { padding: 13px 16px; border-radius: 6px; background: #f4f6f7; }
    .message strong { display: block; margin-bottom: 8px; color: #0b7182; font-size: 11px; }
    .message p { margin: 0; font-size: 13px; line-height: 1.65; }
    .activity { display: flex; align-items: center; gap: 9px; margin: 14px 0; padding: 10px 0; border-top: 1px solid #e3e8e9; color: #56656a; font-size: 12px; }
    .activity b { color: #273438; font-weight: 600; }
    .activity span { margin-left: auto; }
    .decision { margin: 22px 0 0; padding: 15px 16px; border: 1px solid #e6d5af; border-radius: 6px; background: #fffaf0; }
    .decision strong { display: block; color: #735018; font-size: 13px; }
    .decision p { margin: 8px 0 13px; font-size: 12px; line-height: 1.6; }
    .decision button, .artifact button { margin-right: 7px; padding: 6px 10px; border: 1px solid #c9d4d7; border-radius: 5px; color: #233236; background: white; font-size: 11px; }
    .decision button.primary { border-color: #167f8f; color: white; background: #167f8f; }
    .artifact { margin-top: 18px; padding: 12px 0; border-top: 1px solid #dfe5e7; }
    .artifact p { margin: 0 0 9px; font-size: 12px; }
    .composer { flex: 0 0 auto; width: min(100% - 48px, 840px); margin: 0 auto 22px; }
    .composer-tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .composer-tools select, .composer-tools button { height: 28px; padding: 0 8px; border: 1px solid #d2dcdf; border-radius: 4px; color: #506066; background: white; font-size: 11px; }
    .composer-box { display: flex; min-height: 96px; align-items: stretch; gap: 12px; padding: 12px; border: 1px solid #d1dcdf; border-radius: 6px; background: white; }
    .composer-box textarea { min-width: 0; flex: 1; resize: none; border: 0; outline: none; color: #273438; background: transparent; font-size: 13px; }
    .composer-box button { align-self: flex-end; width: 30px; height: 30px; border: 0; border-radius: 5px; color: white; background: #8dbbc2; font-size: 17px; }
    .side { position: relative; display: none; width: 42%; min-width: 360px; flex: 0 0 auto; flex-direction: column; border-left: 1px solid #d8e1e3; background: #f8fafb; }
    .canvas.side-open .side { display: flex; }
    .side-resizer { position: absolute; z-index: 2; top: 0; bottom: 0; left: -5px; width: 9px; cursor: col-resize; }
    .side-resizer:hover, .side-resizer:focus-visible { border-left: 2px solid #7caaae; }
    .side-head { display: flex; height: 54px; flex: 0 0 auto; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; border-bottom: 1px solid #dfe5e7; background: white; }
    .side-head strong, .side-head small { display: block; }
    .side-head strong { font-size: 13px; }
    .side-head small { margin-top: 3px; color: #728086; font-size: 11px; }
    .side-head button { border: 0; color: #728086; background: transparent; font-size: 20px; }
    .tabs { position: relative; display: flex; height: 43px; flex: 0 0 auto; align-items: center; gap: 4px; padding: 0 9px; border-bottom: 1px solid #dfe5e7; background: white; }
    .tab-list { display: flex; min-width: 0; flex: 1; gap: 4px; overflow-x: auto; }
    .tab-item { display: flex; flex: 0 0 auto; align-items: center; border-radius: 4px; }
    .tab-item[data-active="true"] { background: #eaf3f4; }
    .tabs button { height: 30px; padding: 0 9px; border: 0; border-radius: 4px; color: #6b797f; background: transparent; font-size: 11px; white-space: nowrap; }
    .tabs button[aria-selected="true"] { color: #18414a; font-weight: 650; }
    .tabs .tab-close { width: 23px; padding: 0; font-size: 15px; }
    .tabs .tab-close:hover { color: #18414a; }
    .tabs #tab-add { flex: 0 0 auto; font-size: 17px; }
    .tab-menu { position: absolute; z-index: 4; top: 39px; right: 8px; width: 110px; padding: 5px; border: 1px solid #d6dfe2; border-radius: 5px; background: white; box-shadow: 0 8px 20px #172a301a; }
    .tab-menu button { display: block; width: 100%; text-align: left; }
    .tab-menu button:hover { background: #eaf3f4; }
    .side-body { min-height: 0; flex: 1; overflow: auto; }
    .side-section { padding: 17px 20px; border-bottom: 1px solid #dfe5e7; }
    .side-section h2 { margin: 0 0 10px; color: #6c7b81; font-size: 11px; font-weight: 600; }
    .side-section strong { font-size: 15px; }
    .side-section p { margin: 7px 0 0; color: #68777c; font-size: 12px; line-height: 1.6; }
    .file-layout { display: flex; min-height: 100%; }
    .file-tree { width: 37%; flex: 0 0 auto; padding: 12px; border-right: 1px solid #dfe5e7; background: white; }
    .file-tree button { display: block; width: 100%; padding: 8px; border: 0; border-radius: 4px; color: #3a4a50; background: transparent; text-align: left; font-size: 11px; }
    .file-tree button:hover, .file-tree button.active { background: #eaf3f4; }
    .preview { min-width: 0; flex: 1; padding: 18px; background: white; }
    .preview strong { font-size: 12px; }
    .preview pre { margin-top: 14px; overflow: auto; color: #52646a; font: 11px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .terminal { min-height: 100%; padding: 18px; color: #dce9e7; background: #192326; font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .browser { display: flex; min-height: 100%; flex-direction: column; background: white; }
    .browser-bar { padding: 10px; border-bottom: 1px solid #dfe5e7; color: #536268; font-size: 11px; }
    .browser-body { display: grid; min-height: 260px; flex: 1; place-items: center; color: #7b898d; font-size: 13px; }
    .drawer { position: absolute; z-index: 3; top: 0; bottom: 0; left: 0; display: none; width: 252px; padding: 18px 12px; border-right: 1px solid #d4dfe2; background: #f6f9fa; box-shadow: 10px 0 25px #1d343619; }
    .drawer.open { display: block; }
    .drawer header { display: flex; align-items: center; justify-content: space-between; padding: 0 7px 15px; }
    .drawer header strong { font-size: 13px; }
    .drawer header button { border: 0; background: transparent; font-size: 18px; }
    .drawer > button { display: block; width: 100%; margin-bottom: 4px; padding: 10px; border: 0; border-radius: 5px; color: #34474d; background: white; text-align: left; font-size: 12px; }
    .drawer > button small { display: block; margin-top: 4px; color: #718086; }
    .note { padding: 8px 24px; border-top: 1px solid #cbd3d6; color: #607076; background: #f2f4f5; font-size: 11px; }
  </style>
</head>
<body>
  <div class="review">
    <div class="review-bar"><div><strong>Harness 结构原型</strong> <span>演示数据 · 不调用模型或修改文件</span></div><nav class="scenes" aria-label="场景"><button data-scene="empty">空态</button><button data-scene="running">执行中</button><button data-scene="approval">待审批</button><button data-scene="complete">已完成</button><button data-scene="failure">失败恢复</button></nav></div>
    <div class="shell"><header class="shell-bar"><div class="shell-brand"><div class="window-controls" aria-hidden="true"><span></span><span></span><span></span></div><span class="shell-mark">M</span><strong>Mira</strong><span>Mira Harness ▾</span></div><div class="shell-actions"><button type="button">全局搜索</button><button type="button">设置</button></div></header>
      <div class="canvas" id="canvas"><main class="thread"><header class="thread-head"><div class="thread-title"><button class="icon-button" id="sessions-button" aria-label="打开会话" aria-pressed="false">☰</button><div><strong id="task-title">新任务</strong><small>TripFrog / Harness · /Volumes/VrenDisk/project/TripFrog</small></div></div><div class="thread-actions"><span class="status" id="status">尚未开始</span><button class="icon-button" id="side-button" aria-label="切换工作区" aria-pressed="false">▣</button></div></header>
          <div class="thread-scroll" id="thread-scroll"><div class="summary" id="summary" hidden><b id="summary-label">正在执行</b><span id="summary-detail">检查项目文件</span><button id="summary-open" type="button">查看工作内容 →</button></div><div id="messages"></div></div>
          <div class="composer"><div class="composer-tools"><select aria-label="模型"><option>DeepSeek / deepseek-chat</option></select><button type="button">直接执行 ▾</button></div><div class="composer-box"><textarea aria-label="任务内容" placeholder="描述你的任务…"></textarea><button type="button" aria-label="发送任务">↑</button></div></div>
          <aside class="drawer" id="drawer" aria-label="会话列表"><header><strong>会话</strong><button id="drawer-close" aria-label="关闭会话">×</button></header><button type="button" data-session-scene="empty">新任务<small>TripFrog · 当前会话</small></button><button type="button" data-session-scene="complete">整理项目说明<small>TripFrog · 已完成</small></button><button type="button" data-session-scene="failure">修复构建脚本<small>TripFrog · 昨天</small></button></aside>
        </main><aside class="side" aria-label="工作区"><div class="side-resizer" id="side-resizer" role="separator" aria-label="调整工作区宽度" aria-orientation="vertical" tabindex="0"></div><div class="side-head"><div><strong>工作区</strong><small id="side-context">TripFrog · 当前任务</small></div><button id="side-close" type="button" aria-label="关闭工作区">×</button></div><nav class="tabs" aria-label="工作内容"><div class="tab-list" id="tab-list" role="tablist"></div><button id="tab-add" type="button" aria-label="打开工作内容" aria-expanded="false">+</button><div class="tab-menu" id="tab-menu" hidden></div></nav><div class="side-body" id="side-body" role="tabpanel"></div></aside></div>
    </div><div class="note">审阅重点：任务线程是否应默认占满画布；工作区何时打开；悬浮摘要与活动面板是否重复；标签的组织是否符合日常工作。</div>
  </div>
  <script>
    const scenes = {
      empty: { title: '新任务', status: '尚未开始', summary: '', detail: '', messages: '<div class="empty"><h1>从一个任务开始</h1><p>描述你要研究、整理或处理的内容。</p></div>' },
      running: { title: '整理 TripFrog 项目资料', status: '正在执行', summary: '正在执行', detail: '正在检查项目文件', messages: '<div class="message user"><strong>你</strong><p>检查项目结构，整理一份便于接手的说明。</p></div><div class="message"><strong>Mira</strong><p>我会先确认目录与主要模块，再整理运行方式和需要关注的风险。</p></div><div class="activity"><b>读取项目目录</b><span>已完成</span></div><div class="activity"><b>检查配置与入口</b><span>进行中</span></div>' },
      approval: { title: '整理 TripFrog 项目资料', status: '等待确认', summary: '等待确认', detail: '写入 项目说明.md', messages: '<div class="message user"><strong>你</strong><p>检查项目结构，整理一份便于接手的说明。</p></div><div class="message"><strong>Mira</strong><p>已整理项目结构，准备写入说明文件。</p></div><div class="decision"><strong>需要确认后才能写入文件</strong><p>将创建 <code>项目说明.md</code>。请确认这次文件写入。</p><button type="button">拒绝</button><button class="primary" type="button">允许并继续</button></div>' },
      complete: { title: '整理 TripFrog 项目资料', status: '最近任务已完成', summary: '已完成', detail: '1 个文件有变更', messages: '<div class="message user"><strong>你</strong><p>检查项目结构，整理一份便于接手的说明。</p></div><div class="message"><strong>Mira</strong><p>已完成项目说明，包含入口、主要模块、运行方式和待核实事项。</p></div><div class="artifact"><p>成果 · 项目说明.md</p><button type="button" id="open-change">查看文件变更 →</button></div>' },
      failure: { title: '整理 TripFrog 项目资料', status: '执行失败', summary: '执行失败', detail: '读取配置文件时失败', messages: '<div class="message user"><strong>你</strong><p>检查项目结构，整理一份便于接手的说明。</p></div><div class="message"><strong>Mira</strong><p>已确认主要目录，但读取配置文件时失败。已完成的检查记录仍然保留。</p></div><div class="decision"><strong>本次任务未完成</strong><p>检查文件权限后，可以在原会话继续，不需要重新创建任务。</p><button type="button">查看活动</button><button class="primary" type="button">继续任务</button></div>' },
    }
    const panels = {
      activity: () => `<section class="side-section"><h2>当前任务</h2><strong>${scenes[currentScene].status}</strong><p>${scenes[currentScene].detail || '还没有执行记录'}</p></section><section class="side-section"><h2>执行活动</h2><p>${currentScene === 'empty' ? '暂无活动' : '读取项目目录 · 检查配置与入口'}</p></section><section class="side-section"><h2>工具记录</h2><p>${currentScene === 'empty' ? '暂无工具记录' : 'read_file · list_files'}</p></section>`,
      files: () => '<div class="file-layout"><div class="file-tree"><button>▾ TripFrog</button><button class="active">README.md</button><button>package.json</button><button>src/</button></div><div class="preview"><strong>README.md</strong><pre># TripFrog\n\n项目说明与运行方式\n\n安装依赖\nnpm install</pre></div></div>',
      changes: () => '<section class="side-section"><h2>本次任务变更</h2><strong>项目说明.md</strong><p>新增文件 · 点击可查看差异与内容。</p></section><div class="preview"><pre>+ # 项目说明\n+ 项目入口与主要模块\n+ 运行方式与待核实事项</pre></div>',
      terminal: () => '<div class="terminal">终端示意 · 不执行命令<br><br>TripFrog % npm test<br><br>✓ 12 tests passed<br><br>TripFrog % ▌</div>',
      browser: () => '<div class="browser"><div class="browser-bar">网页示意 · 不发起网络请求</div><div class="browser-body">https://example.com/</div></div>',
    }
    let currentScene = 'empty'
    let currentTab = 'activity'
    const openedTabs = ['activity']
    const tabNames = { activity: '任务活动', files: '文件', changes: '变更', terminal: '终端', browser: '浏览器' }
    const canvas = document.getElementById('canvas')
    function render() {
      const scene = scenes[currentScene]
      document.getElementById('task-title').textContent = scene.title
      document.getElementById('status').textContent = scene.status
      document.getElementById('status').className = `status ${currentScene}`
      document.getElementById('summary').hidden = !scene.summary
      document.getElementById('summary-label').textContent = scene.summary
      document.getElementById('summary-detail').textContent = scene.detail
      document.getElementById('messages').innerHTML = scene.messages
      document.getElementById('side-body').innerHTML = panels[currentTab]()
      document.getElementById('side-body').setAttribute('aria-label', tabNames[currentTab])
      document.querySelectorAll('[data-scene]').forEach(button => button.setAttribute('aria-current', String(button.dataset.scene === currentScene)))
      document.getElementById('tab-list').innerHTML = openedTabs.map(tab => `<span class="tab-item" data-active="${tab === currentTab}"><button type="button" role="tab" data-tab="${tab}" aria-selected="${tab === currentTab}">${tabNames[tab]}</button>${tab === 'activity' ? '' : `<button type="button" class="tab-close" data-close-tab="${tab}" aria-label="关闭${tabNames[tab]}">×</button>`}</span>`).join('')
      document.getElementById('tab-menu').innerHTML = Object.entries(tabNames).filter(([tab]) => !openedTabs.includes(tab)).map(([tab, name]) => `<button data-open-tab="${tab}">${name}</button>`).join('') || '<small>已全部打开</small>'
      document.getElementById('open-change')?.addEventListener('click', () => openTab('changes'))
    }
    function openTab(tab) { if (!openedTabs.includes(tab)) openedTabs.push(tab); currentTab = tab; canvas.classList.add('side-open'); document.getElementById('side-button').setAttribute('aria-pressed', 'true'); document.getElementById('tab-menu').hidden = true; document.getElementById('tab-add').setAttribute('aria-expanded', 'false'); render() }
    function closeTab(tab) { const index = openedTabs.indexOf(tab); if (index < 0 || tab === 'activity') return; openedTabs.splice(index, 1); if (currentTab === tab) currentTab = openedTabs[Math.max(0, index - 1)]; render() }
    document.querySelectorAll('[data-scene]').forEach(button => button.addEventListener('click', () => { currentScene = button.dataset.scene; render() }))
    document.getElementById('tab-list').addEventListener('click', event => { const close = event.target.closest('[data-close-tab]'); if (close) return closeTab(close.dataset.closeTab); const tab = event.target.closest('[data-tab]'); if (tab) openTab(tab.dataset.tab) })
    document.getElementById('tab-menu').addEventListener('click', event => { const tab = event.target.closest('[data-open-tab]'); if (tab) openTab(tab.dataset.openTab) })
    document.getElementById('side-button').addEventListener('click', () => { canvas.classList.toggle('side-open'); document.getElementById('side-button').setAttribute('aria-pressed', String(canvas.classList.contains('side-open'))) })
    document.getElementById('side-close').addEventListener('click', () => { canvas.classList.remove('side-open'); document.getElementById('side-button').setAttribute('aria-pressed', 'false') })
    document.getElementById('summary-open').addEventListener('click', () => openTab('activity'))
    document.getElementById('tab-add').addEventListener('click', () => { const menu = document.getElementById('tab-menu'); menu.hidden = !menu.hidden; document.getElementById('tab-add').setAttribute('aria-expanded', String(!menu.hidden)) })
    document.getElementById('sessions-button').addEventListener('click', () => { document.getElementById('drawer').classList.toggle('open'); document.getElementById('sessions-button').setAttribute('aria-pressed', String(document.getElementById('drawer').classList.contains('open'))) })
    document.getElementById('drawer-close').addEventListener('click', () => { document.getElementById('drawer').classList.remove('open'); document.getElementById('sessions-button').setAttribute('aria-pressed', 'false') })
    document.getElementById('drawer').addEventListener('click', event => { const session = event.target.closest('[data-session-scene]'); if (!session) return; currentScene = session.dataset.sessionScene; document.getElementById('drawer').classList.remove('open'); document.getElementById('sessions-button').setAttribute('aria-pressed', 'false'); render() })
    const resizer = document.getElementById('side-resizer')
    function resizeSide(clientX) { const width = canvas.getBoundingClientRect().width; document.querySelector('.side').style.width = `${Math.max(360, Math.min(width * .54, Math.max(width * .32, canvas.getBoundingClientRect().right - clientX)))}px` }
    resizer.addEventListener('pointerdown', event => { resizer.setPointerCapture(event.pointerId); resizeSide(event.clientX) })
    resizer.addEventListener('pointermove', event => { if (resizer.hasPointerCapture(event.pointerId)) resizeSide(event.clientX) })
    resizer.addEventListener('keydown', event => { if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return; event.preventDefault(); const side = document.querySelector('.side'); resizeSide(canvas.getBoundingClientRect().right - side.getBoundingClientRect().width + (event.key === 'ArrowLeft' ? -20 : 20)) })
    render()
  </script>
</body>
</html>
